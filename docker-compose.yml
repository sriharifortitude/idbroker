services:
  postgres:
    image: postgres:17-alpine
    container_name: idbroker-postgres
    environment: { POSTGRES_USER: idbroker, POSTGRES_PASSWORD: idbroker_local_dev, POSTGRES_DB: idbroker }
    ports: ["127.0.0.1:5436:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U idbroker -d idbroker"], interval: 2s, timeout: 3s, retries: 20 }
